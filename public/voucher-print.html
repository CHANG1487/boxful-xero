<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>憑證列印預覽</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/print.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
</head>
<body class="print-body">
  <div class="print-toolbar no-print">
    <button id="print-btn" class="btn btn-primary">輸出成 PDF 檔</button>
    <button id="cancel-btn" class="btn btn-ghost">取消 / 回上一頁</button>
    <span id="print-status" class="muted small"></span>
    <span class="print-hint muted small no-print">列印黑白請按【輸出成 PDF 檔】→ 目的地選「另存為 PDF」→ 存檔後用 PDF 檢視器列印</span>
  </div>

  <div id="sheets"></div>

  <script src="/js/notify.js"></script>
  <script src="/js/print.js"></script>
</body>
</html>
